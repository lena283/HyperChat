<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Friends</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            margin: 0;
            padding: 20px;
        }

        .box {
            max-width: 700px;
            margin: auto;
            background: #1b1b1b;
            padding: 20px;
            border-radius: 12px;
        }

        input, button {
            padding: 10px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 16px;
        }

        input {
            width: 100%;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button, a.btn {
            display: inline-block;
            background: #4a7dff;
            color: white;
            text-decoration: none;
            cursor: pointer;
            margin-top: 5px;
        }

        .friend {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        a.btn.red {
            background: #d94b4b;
        }

        a.btn.gray {
            background: #555;
        }
    </style>
</head>
<body>
<div class="box">
    <h1>Friends</h1>

    <form method="POST" action="/add_friend">
        <input type="text" name="friend_code" placeholder="Enter friend HX code">
        <button type="submit">Add friend</button>
    </form>

    <hr>

    {% if friends %}
        {% for friend in friends %}
            <div class="friend">
                <strong>{{ friend[0] }}</strong><br>
                <span>{{ friend[1] }}</span>

                <div class="actions">
                    <a class="btn" href="/chat/{{ friend[1] }}">Open chat</a>
                    <a class="btn red" href="/delete_friend/{{ friend[1] }}">Delete</a>
                </div>
            </div>
        {% endfor %}
    {% else %}
        <p>No friends yet.</p>
    {% endif %}

    <p><a class="btn gray" href="/profile">Back to profile</a></p>
</div>
</body>
</html>
