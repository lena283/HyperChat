<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HyperChat — Друзья</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <nav>
      <a href="/profile">Профиль</a>
      <a href="/friends">Друзья</a>
      <a href="/logout">Выйти</a>
    </nav>

    <h2>Друзья</h2>

    {% if not friends %}
      <p style="text-align:center;">У вас пока нет друзей. Добавьте друга по его коду HX-......</p>
    {% endif %}

    <form method="post" action="/add_friend">
      <input name="friend_code" placeholder="HX-123456" required>
      <button type="submit">Добавить</button>
    </form>

    {% if friends %}
      <ul>
        {% for f in friends %}
          <li>
            <span>{{ f[0] }} ({{ f[1] }})</span>
            <span>
              <a href="/chat/{{ f[1] }}">Чат</a>
            </span>
          </li>
        {% endfor %}
      </ul>
    {% endif %}
  </div>
</body>
</html>
