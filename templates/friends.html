<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HyperChat — Друзья</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <nav>
        <a href="/profile">Профиль</a>
        <a href="/friends">Друзья</a>
        <a href="/logout">Выйти</a>
    </nav>

    <h2>Друзья</h2>

    <form method="post" action="/add_friend">
        <input type="text" name="friend_code" placeholder="HX-123456" required>
        <button type="submit">Добавить друга</button>
    </form>

    <div style="margin-bottom:20px;">
        <button type="button" onclick="openBot()">Чат с ботом</button>
    </div>

    {% if not friends %}
        <p style="text-align:center;margin-top:20px;">
            У вас пока нет друзей.
        </p>
    {% endif %}

    {% if friends %}
    <div class="chat-layout">

        <div class="friends-panel">
            <h3>Список друзей</h3>

            {% for f in friends %}
            <div class="friend-card" onclick="openChat('{{f[1]}}','{{f[0]}}')">
                <b>{{f[0]}}</b>
                <br>
                <small>{{f[1]}}</small>
            </div>
            {% endfor %}
        </div>

        <div class="chat-panel">
            <h2 id="chatTitle">Выберите друга</h2>
            <div id="messages"></div>

            <form id="sendForm">
                <input type="text" id="messageInput" placeholder="Введите сообщение">
                <button type="submit">Отправить</button>
            </form>

            <div style="margin-top:10px;">
                <button type="button" onclick="startRecording()">🎤 Запись</button>
                <button type="button" onclick="stopRecording()">⏹ Стоп</button>
            </div>
        </div>

    </div>
    {% endif %}

</div>

<script>
let currentFriend = "";
const BOT_CODE = "HX-000000";
let mediaRecorder = null;
let audioChunks = [];

function openChat(code, name) {
    currentFriend = code;
    document.getElementById("chatTitle").innerText = "Чат с " + name;
    loadMessages();
}

function openBot() {
    currentFriend = BOT_CODE;
    document.getElementById("chatTitle").innerText = "Чат с HyperBot";
    loadMessages();
}

function loadMessages() {
    if (currentFriend === "") return;

    fetch("/messages/" + encodeURIComponent(currentFriend), { cache: "no-store" })
        .then(response => response.json())
        .then(data => {
            let html = "";
            data.forEach(msg => {
                if (msg.type === "voice") {
                    html += `
                        <div class="msg">
                            <b>${msg.sender}</b>
                            <br>
                            <audio controls src="${msg.audio}"></audio>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="msg">
                            <b>${msg.sender}</b>
                            <br>
                            ${msg.text}
                        </div>
                    `;
                }
            });
            const box = document.getElementById("messages");
            box.innerHTML = html;
            box.scrollTop = box.scrollHeight;
        });
}

document.getElementById("sendForm").addEventListener("submit", function(e) {
    e.preventDefault();

    if (currentFriend === "") return;

    const text = document.getElementById("messageInput").value.trim();
    if (!text) return;

    fetch("/send_ajax", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            friend: currentFriend,
            message: text
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.ok) {
            document.getElementById("messageInput").value = "";
            loadMessages();
        }
    });
});

async function startRecording() {
    if (currentFriend === "") return;

    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
        const blob = new Blob(audioChunks, { type: "audio/webm" });
        const formData = new FormData();
        formData.append("audio", blob, "voice.webm");
        formData.append("friend", currentFriend);

        await fetch("/send_voice", {
            method: "POST",
            body: formData
        });

        loadMessages();
    };

    mediaRecorder.start();
}

function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
    }
}

setInterval(loadMessages, 500);
</script>

</body>
</html>
