<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HyperChat - Регистрация</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>
<body>

<div class="bg1"></div>
<div class="bg2"></div>

<div class="register-container">

    <div class="logo">
        ⚡ HyperChat
    </div>

    <div class="subtitle">
        Добро пожаловать в HyperChat
    </div>

    <div class="card">

        <h1>Создать профиль</h1>

        <p class="description">
            Введите свой ник. HX-код будет создан автоматически.
        </p>

        <form method="POST">

            <input
                type="text"
                name="nickname"
                placeholder="Ваш ник"
                required
                maxlength="25"
            >

            <button type="submit">
                🚀 Войти в HyperChat
            </button>

        </form>

    </div>

</div>

</body>
</html>
