<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HyperChat — Регистрация</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h2>HyperChat регистрация</h2>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
      <input name="nickname" placeholder="Никнейм" required autofocus>
      <button type="submit">Создать аккаунт</button>
    </form>
  </div>
</body>
</html>
