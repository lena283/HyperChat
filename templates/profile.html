<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HyperChat - Профиль</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>
<body>

<div class="bg1"></div>
<div class="bg2"></div>

<div class="sidebar">

    <div class="logo">
        ⚡ HyperChat
    </div>

    <a href="/profile" class="menu-btn active">
        👤 Профиль
    </a>

    <a href="/friends" class="menu-btn">
        👥 Друзья
    </a>

    <a href="/logout" class="menu-btn logout">
        🚪 Выйти
    </a>

</div>

<div class="content">

    <div class="profile-card">

        <div class="avatar">
            {{ user[0][0]|upper }}
        </div>

        <h1>{{ user[0] }}</h1>

        <div class="hx-code">
            {{ user[1] }}
        </div>

        <form method="POST">

            <label>
                📝 О себе
            </label>

            <textarea
                name="bio"
                placeholder="Расскажите немного о себе..."
            >{{ user[2] }}</textarea>

            <button type="submit">
                💾 Сохранить
            </button>

        </form>

    </div>

</div>

</body>
</html>
