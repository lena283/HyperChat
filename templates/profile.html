<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HyperChat — Профиль</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <nav>
      <a href="/profile">Профиль</a>
      <a href="/friends">Друзья</a>
      <a href="/logout">Выйти</a>
    </nav>

    <h2>Профиль</h2>

    <div class="profile-info">
      <p><strong>Ник:</strong> {{ user[0] }}</p>
      <p><strong>Код:</strong> {{ user[1] }}</p>
    </div>

    <form method="post">
      <textarea name="bio" rows="6" placeholder="Биография">{{ user[2] }}</textarea><br>
      <button type="submit">Сохранить био</button>
    </form>
  </div>
</body>
</html>
