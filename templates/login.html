{% extends "base.html" %}
{% block title %}HyperChat — Вход{% endblock %}

{% block content %}
<h2>HyperChat вход</h2>

{% if error %}
  <div class="error">{{ error }}</div>
{% endif %}

<form method="post">
  <input name="nickname" placeholder="Никнейм" required autofocus>
  <input name="password" type="password" placeholder="Пароль" required>
  <button type="submit">Войти</button>
</form>

<p style="text-align:center;">
  Нет аккаунта? <a href="/register">Регистрация</a>
</p>
{% endblock %}
